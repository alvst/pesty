name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: macOS and iOS (Xcode 26.3)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Verify shared CloudKit contract and metadata
        run: |
          cmp Sources/Pesty/Sync/CloudKitSchema.swift iOSApp/Pesty/Sync/CloudKitSchema.swift
          plutil -lint iOSApp/Pesty/Resources/Info.plist
          plutil -lint iOSApp/Pesty/Resources/Pesty.entitlements
          plutil -lint packaging/Pesty-MAS.entitlements

      - name: Test macOS app
        run: swift test

      - name: Build Mac App Store code path
        run: swift build -Xswiftc -DMAS

      - name: Test iPhone and iPad companion
        working-directory: iOSApp
        run: |
          xcodebuild test \
            -project Pesty.xcodeproj \
            -scheme Pesty \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath /tmp/PestyCI \
            CODE_SIGNING_ALLOWED=NO

      - name: Build physical-device CloudKit code path
        working-directory: iOSApp
        run: |
          xcodebuild build \
            -project Pesty.xcodeproj \
            -scheme Pesty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/PestyDeviceCI \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app bundle
        run: VERSION=0.0.0 BUILD=ci ./scripts/build_app.sh

      - name: Check patch whitespace
        run: git diff --check
