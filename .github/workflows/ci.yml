name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: macOS and iOS (Xcode 26.3)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test macOS app
        run: swift test

      - name: Build Mac App Store code path
        run: swift build -Xswiftc -DMAS

      - name: Test iPhone and iPad companion
        working-directory: iOSApp
        run: |
          xcodebuild test \
            -project Pesty-Alvie.xcodeproj \
            -scheme Pesty-Alvie \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath /tmp/PestyAlvieCI \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app bundle
        run: VERSION=0.0.0 BUILD=ci ./scripts/build_app.sh

      - name: Check patch whitespace
        run: git diff --check
