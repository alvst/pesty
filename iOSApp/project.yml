name: Pesty
options:
  bundleIdPrefix: com.alvst
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  Pesty:
    type: application
    platform: iOS
    sources:
      - path: Pesty
        excludes:
          - Tests
    dependencies:
      - target: PestyWidget
        embed: true
      - target: PestyShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvst.pesty.companion
        PRODUCT_NAME: Pesty
        PRODUCT_MODULE_NAME: Pesty
        INFOPLIST_FILE: Pesty/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pesty/Resources/Pesty.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        Release:
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production
  PestyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PestyWidget
      - path: Pesty/Domain/ClipKind.swift
      - path: Pesty/Domain/PestyClip.swift
      - path: Pesty/Domain/PestyBoard.swift
      - path: Pesty/Domain/PestyLibrary.swift
      - path: Pesty/Store/LocalLibraryPersistence.swift
      - path: Pesty/Store/LocalFileProtection.swift
      - path: Pesty/UI/PestyPalette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvst.pesty.companion.widget
        PRODUCT_NAME: PestyWidget
        PRODUCT_MODULE_NAME: PestyWidget
        INFOPLIST_FILE: PestyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PestyWidget/PestyWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  PestyShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PestyShareExtension
      - path: Pesty/Domain/ClipKind.swift
      - path: Pesty/Domain/PestyClip.swift
      - path: Pesty/Domain/PestyBoard.swift
      - path: Pesty/Domain/PestyLibrary.swift
      - path: Pesty/Store/LocalLibraryPersistence.swift
      - path: Pesty/Store/LocalFileProtection.swift
      - path: Pesty/Store/LocalAssetPersistence.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvst.pesty.companion.share
        PRODUCT_NAME: PestyShareExtension
        PRODUCT_MODULE_NAME: PestyShareExtension
        INFOPLIST_FILE: PestyShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PestyShareExtension/PestyShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.5.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  PestyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Pesty/Tests
    dependencies:
      - target: Pesty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvst.pesty.companion.tests
        MARKETING_VERSION: "2.5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pesty.app/Pesty"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Pesty-Mac:
    type: application
    platform: macOS
    productName: Pesty
    sources:
      - path: ../Sources/Pesty
        name: Pesty-Mac
      - path: Pesty-Mac/Resources/container-migration.plist
        buildPhase: resources
      # Track the compiled icon: current iconutil releases cannot reliably
      # rebuild an iconset produced by older toolchains.
      - path: ../packaging/Pesty.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvst.pesty
        PRODUCT_NAME: Pesty
        PRODUCT_MODULE_NAME: Pesty
        INFOPLIST_FILE: Pesty-Mac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pesty-Mac/Resources/Pesty-Mac.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.0.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAS"
schemes:
  Pesty:
    build:
      targets:
        Pesty: all
        PestyTests: [test]
    test:
      targets:
        - PestyTests
  # Screenshot build: launches with --demo so the library is the fixed seed
  # from DemoLibrary, never the real one.
  Pesty Demo:
    build:
      targets:
        Pesty: all
    run:
      config: Debug
      commandLineArguments:
        "--demo": true
  Pesty Mac Development:
    build:
      targets:
        Pesty-Mac: all
    run:
      config: Debug
